# coturn 配置 —— 跨网 TURN 中继
# 改下两行为你的服务器实际地址
listening-ip=0.0.0.0
external-ip=YOUR_PUBLIC_IP

listening-port=3478
# TLS 端口（可选，需证书）
tls-listening-port=5349

# 中继端口范围（防火墙需放行这段 UDP）
min-port=50000
max-port=60000

# 长期凭证机制（WebRTC 必须用这个）
lt-cred-mech

# 静态用户名/密码（生产环境建议用 REST API 动态凭证）
user=p2p:p2psecret

# 域
realm=turn.p2p.demo

# 日志
verbose
log-file=/dev/stdout

# 不开多线程复用（小规模够用）
no-cli

# 允许所有源（生产环境应收紧到已知网段）
no-loopback-peers
no-multicast-peers
